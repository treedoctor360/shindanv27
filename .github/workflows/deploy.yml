# GitHub Pages への自動デプロイ
# Pages の Source 設定は configure-pages ステップが自動で
# 「GitHub Actions」方式に切り替える（手動設定は不要）。
#
# main への push で自動実行。Actions タブから手動実行（workflow_dispatch）も可能。
# ※ main 作成までの暫定として開発ブランチの push でも起動する。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tree-shindan-vite-react-i1y2hh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存をインストール
        run: npm ci
      - name: 判定ロジックのテスト
        run: npm test
      - name: 本番ビルド
        run: npm run build
      # Pages を「GitHub Actions」方式で有効化（Sourceがブランチ方式でも上書きする）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
